name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  k0-gate:
    name: K0 Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # TinyGo is installed BEFORE the tests, not after. koine/wire's surface
      # tests build the fixture guests and read the export and import
      # sections off the binary; with no TinyGo on PATH they skip, and a
      # skipped gate is a gate that is not there.
      - name: Install TinyGo
        run: |
          wget https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo_0.41.1_amd64.deb
          sudo dpkg -i tinygo_0.41.1_amd64.deb

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 -v ./...

      - name: tinygo build
        run: tinygo build -o /dev/null -target wasm-unknown ./internal/tinygocheck

      - name: wasip1 wasm build
        run: GOOS=wasip1 GOARCH=wasm go build -o /dev/null ./internal/tinygocheck

      # The whole SDK under the standard toolchain's wasm target, not just
      # the compile probe: koine/wire's host bindings only exist under a wasm
      # build, and E-A says both toolchains are supported.
      - name: wasip1 wasm build (whole module)
        run: GOOS=wasip1 GOARCH=wasm go build ./...

      # Both fixture guests, built the way the engine builds them. The
      # negative one must build too — a refusal fixture that does not compile
      # is a refusal test with nothing to refuse.
      - name: guest fixtures build under TinyGo
        run: |
          tinygo build -o /dev/null -target wasm-unknown ./fixtures/guest/steward
          tinygo build -o /dev/null -target wasm-unknown ./fixtures/guest/secondpath

      # Generation is a function of its inputs. Regenerating everything must
      # move nothing.
      - name: go generate leaves no diff
        run: |
          go generate ./cmd/koinegen/fixtures/
          go generate ./fixtures/guest/steward
          go generate ./fixtures/guest/secondpath
          git diff --exit-code
