name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  k0-gate:
    name: K0 Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 -v ./...

      - name: Install TinyGo
        run: |
          wget https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo_0.41.1_amd64.deb
          sudo dpkg -i tinygo_0.41.1_amd64.deb

      - name: tinygo build
        run: tinygo build -o /dev/null -target wasm-unknown ./internal/tinygocheck

      - name: wasip1 wasm build
        run: GOOS=wasip1 GOARCH=wasm go build -o /dev/null ./internal/tinygocheck
